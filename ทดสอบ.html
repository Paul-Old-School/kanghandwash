<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧺 ฝากซัก-อบ-พับ (Orange Card)</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            padding-bottom: 100px; /* Space for fixed footer */
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #e5e7eb;
        }

        .card-header {
            border-left: 4px solid #ff9800; /* Orange for Orange Card */
            padding-left: 12px;
            margin-bottom: 12px;
        }

        .btn-select {
            transition: all 0.2s;
        }
        
        .btn-select.active {
            background-color: #eff6ff;
            border-color: #3b82f6;
            color: #1d4ed8;
            font-weight: bold;
        }

        .fixed-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 16px;
            box-shadow: 0 -4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 50;
        }
        
        /* Custom Checkbox Style */
        .option-card {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
        }
        .option-card:hover { border-color: #d1d5db; }
        .option-card input:checked + div {
            background-color: #fff7ed; /* Orange tint */
            border-color: #ff9800;
            color: #c2410c;
        }
        .option-card input:checked + div::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: 8px;
            right: 8px;
            color: #ff9800;
        }
    </style>
</head>
<body class="bg-gray-100">

    <div class="bg-gradient-to-r from-gray-800 to-gray-900 text-white p-4 shadow-lg sticky top-0 z-40">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-green-500 rounded-full flex items-center justify-center text-xl shadow-md">
                    🧺
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">ร้านกังหันดีวอช</h1>
                    <p class="text-xs text-green-400">ฝากซัก-อบ-พับ (บัตรคิวสีส้ม)</p>
                </div>
            </div>
            <div id="userProfile" class="hidden text-right">
                <p class="text-xs text-gray-400">ผู้ใช้งาน</p>
                <p class="text-sm font-bold" id="displayName">Loading...</p>
            </div>
        </div>
    </div>

    <div class="container mx-auto max-w-md p-4">

        <div class="card">
            <div class="card-header">
                <h2 class="font-bold text-lg">1. จำนวนตะกร้า</h2>
            </div>
            <div class="flex items-center justify-between bg-gray-50 p-4 rounded-xl">
                <span class="text-gray-600">จำนวนตะกร้าที่ฝาก</span>
                <div class="flex items-center gap-4">
                    <button onclick="updateBasketCount(-1)" class="w-10 h-10 rounded-full bg-white border border-gray-300 text-gray-600 hover:bg-gray-100 shadow-sm text-xl font-bold">-</button>
                    <span id="basketCountDisplay" class="text-2xl font-bold w-8 text-center">1</span>
                    <button onclick="updateBasketCount(1)" class="w-10 h-10 rounded-full bg-orange-500 text-white hover:bg-orange-600 shadow-md text-xl font-bold">+</button>
                </div>
            </div>
        </div>

        <div id="basketsContainer">
            </div>

        <div class="card mt-6">
            <div class="card-header border-green-500">
                <h2 class="font-bold text-lg">3. ข้อมูลติดต่อ & ชำระเงิน</h2>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">เบอร์โทรศัพท์ (จำเป็น)</label>
                    <input type="tel" id="customerPhone" placeholder="08x-xxx-xxxx" class="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">วิธีชำระเงิน</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="option-card">
                            <input type="radio" name="paymentMethod" value="qr" class="hidden" checked onchange="togglePaymentInfo()">
                            <div class="p-3 rounded-xl border-2 border-transparent text-center h-full flex flex-col items-center justify-center gap-2 bg-gray-50">
                                <i class="fas fa-qrcode text-2xl text-blue-600"></i>
                                <span class="text-sm font-bold">สแกน QR</span>
                            </div>
                        </label>
                        <label class="option-card">
                            <input type="radio" name="paymentMethod" value="cash" class="hidden" onchange="togglePaymentInfo()">
                            <div class="p-3 rounded-xl border-2 border-transparent text-center h-full flex flex-col items-center justify-center gap-2 bg-gray-50">
                                <i class="fas fa-money-bill-wave text-2xl text-green-600"></i>
                                <span class="text-sm font-bold">เงินสด</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div id="qrInfo" class="bg-blue-50 p-4 rounded-xl border border-blue-100 text-center">
                    <p class="text-sm text-blue-800 mb-2">พร้อมเพย์: ร้านกังหันดีวอช</p>
                    <div class="bg-white p-2 inline-block rounded-lg shadow-sm mb-2">
                         <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=promptpay-0812345678" alt="QR Code" class="w-32 h-32">
                    </div>
                    <div class="mt-2">
                        <label class="block w-full text-sm text-blue-600 bg-white border border-blue-200 rounded-lg p-2 cursor-pointer hover:bg-blue-50 transition">
                            <i class="fas fa-camera mr-2"></i> อัปโหลดสลิปโอนเงิน
                            <input type="file" class="hidden">
                        </label>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="fixed-footer">
        <div class="container mx-auto max-w-md">
            <div class="flex justify-between items-center mb-3">
                <span class="text-gray-600">ราคารวมโดยประมาณ</span>
                <span class="text-2xl font-bold text-orange-600"><span id="totalPriceDisplay">0</span> ฿</span>
            </div>
            <button onclick="submitOrder()" class="w-full bg-gradient-to-r from-green-500 to-green-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-xl transform active:scale-95 transition-all flex items-center justify-center gap-2">
                <i class="fas fa-paper-plane"></i> ยืนยันคำสั่งซื้อ
            </button>
        </div>
    </div>

    <template id="basketTemplate">
        <div class="card basket-card" data-index="{index}">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-gray-100">
                <h3 class="font-bold text-gray-700"><i class="fas fa-shopping-basket text-orange-400 mr-2"></i>ตะกร้าที่ <span class="basket-index">{num}</span></h3>
                <button class="text-xs text-red-400 underline" onclick="clearBasket({index})">ล้างค่า</button>
            </div>
            
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                    <label class="text-xs text-gray-500 block mb-1">เลขบัตรคิวสีส้ม</label>
                    <input type="number" class="basket-queue w-full p-2 bg-gray-50 border border-gray-200 rounded-lg text-center font-bold text-lg focus:ring-2 focus:ring-orange-400 outline-none" placeholder="#">
                </div>
                <div>
                    <label class="text-xs text-gray-500 block mb-1">อุณหภูมิน้ำ</label>
                    <select class="basket-temp w-full p-2 bg-gray-50 border border-gray-200 rounded-lg text-sm h-[46px]">
                        <option value="cold">❄️ น้ำเย็น</option>
                        <option value="warm">🌡️ น้ำอุ่น</option>
                        <option value="hot">🔥 น้ำร้อน</option>
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label class="flex items-center justify-center w-full p-3 border-2 border-dashed border-gray-300 rounded-xl cursor-pointer hover:border-orange-400 hover:bg-orange-50 transition bg-gray-50">
                    <div class="text-center photo-label">
                        <i class="fas fa-camera text-gray-400 mb-1"></i>
                        <p class="text-xs text-gray-500">ถ่ายรูปตะกร้า + บัตรคิว</p>
                    </div>
                    <input type="file" class="hidden basket-photo" accept="image/*" onchange="previewImage(this)">
                    <img src="" class="hidden w-full h-32 object-cover rounded-lg preview-img">
                </label>
            </div>

            <div class="mb-4">
                <label class="text-xs text-gray-500 block mb-2">ประเภทบริการ</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setService({index}, 'wash_only')" class="service-btn btn-wash p-2 rounded-lg border border-gray-200 text-xs font-bold text-gray-600 hover:bg-blue-50">
                        ซักอย่างเดียว
                    </button>
                    <button onclick="setService({index}, 'dry_only')" class="service-btn btn-dry p-2 rounded-lg border border-gray-200 text-xs font-bold text-gray-600 hover:bg-orange-50">
                        อบอย่างเดียว
                    </button>
                    <button onclick="setService({index}, 'wash_dry')" class="service-btn btn-both active bg-green-50 border-green-500 text-green-700 p-2 rounded-lg border text-xs font-bold shadow-sm">
                        ซัก + อบ
                    </button>
                </div>
                <input type="hidden" class="basket-service" value="wash_dry">
            </div>

            <div class="flex items-center justify-between mb-4 bg-gray-100 p-1 rounded-lg">
                <button onclick="setMode({index}, 'self')" class="mode-btn mode-self w-1/2 text-xs py-1.5 rounded-md font-bold shadow-sm bg-white text-gray-800">📏 กำหนดเอง</button>
                <button onclick="setMode({index}, 'maid')" class="mode-btn mode-maid w-1/2 text-xs py-1.5 rounded-md font-bold text-gray-500">👩 แม่บ้านเลือก</button>
                <input type="hidden" class="basket-mode" value="self">
            </div>

            <div class="size-options space-y-3">
                <div class="wash-section">
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-bold text-blue-600">เครื่องซัก (ขนาด)</label>
                        <span class="text-xs text-gray-500 wash-price">40฿</span>
                    </div>
                    <select class="basket-wash-size w-full p-2 border border-gray-300 rounded-lg text-sm" onchange="calculatePrice()">
                        <option value="10kg" data-price="40">10kg (40฿) - ผ้า ~40 ชิ้น</option>
                        <option value="15kg" data-price="50">15kg (50฿) - ผ้า 2-3 คน</option>
                        <option value="20kg" data-price="60">20kg (60฿) - ผ้านวม 6 ฟุต</option>
                        <option value="30kg" data-price="100">30kg (100฿) - ผ้านวมใหญ่</option>
                    </select>
                </div>

                <div class="dry-section">
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-bold text-orange-600">เครื่องอบ (ขนาด)</label>
                        <span class="text-xs text-gray-500 dry-price">50฿</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <select class="basket-dry-size w-full p-2 border border-gray-300 rounded-lg text-sm" onchange="calculatePrice()">
                            <option value="16kg" data-price="50">16kg (50฿)</option>
                            <option value="25kg" data-price="70">25kg (70฿)</option>
                        </select>
                        <select class="basket-dry-temp w-full p-2 border border-gray-300 rounded-lg text-sm">
                            <option value="high">🔥 สูง (High)</option>
                            <option value="medium" selected>🌡️ กลาง (Med)</option>
                            <option value="low">❄️ ต่ำ (Low)</option>
                        </select>
                    </div>
                    <label class="flex items-center gap-2 text-xs text-gray-600 cursor-pointer">
                        <input type="checkbox" class="basket-dry-extra" onchange="calculatePrice()"> 
                        <span>ต่อเวลาอบ (+10฿)</span>
                    </label>
                </div>
            </div>
            
            <div class="maid-message hidden p-3 bg-yellow-50 rounded-lg border border-yellow-200 text-center">
                <p class="text-xs text-yellow-800">👩 แม่บ้านจะประเมินขนาดและราคาให้หน้างานค่ะ</p>
            </div>
        </div>
    </template>

    <script>
        // State
        let basketCount = 1;
        let basketsData = [];

        // Initialize LIFF
        async function main() {
            // Mock LIFF for browser testing
            if (!window.liff) {
                console.warn("LIFF SDK not loaded");
                return;
            }
            
            try {
                await liff.init({ liffId: "YOUR_LIFF_ID_HERE" }); // ใส่ LIFF ID จริงเมื่อใช้งาน
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    document.getElementById('displayName').textContent = profile.displayName;
                    document.getElementById('userProfile').classList.remove('hidden');
                } else {
                    // For demo/web testing: show mock user
                    document.getElementById('displayName').textContent = "Guest User";
                    document.getElementById('userProfile').classList.remove('hidden');
                }
            } catch (err) {
                console.log("LIFF Initialization failed (Expected in browser):", err);
            }
            
            // Initial Render
            renderBaskets();
        }
        main();

        // --- Core Logic ---

        function updateBasketCount(change) {
            const newCount = basketCount + change;
            if (newCount >= 1 && newCount <= 10) {
                basketCount = newCount;
                document.getElementById('basketCountDisplay').textContent = basketCount;
                renderBaskets();
            }
        }

        function renderBaskets() {
            const container = document.getElementById('basketsContainer');
            const template = document.getElementById('basketTemplate').innerHTML;
            
            // เก็บค่าเดิมไว้ก่อน re-render (แบบง่าย) - ใน App จริงควรใช้ Reactive Framework (Vue/React)
            // แต่สำหรับ Vanilla JS, เราจะเช็คว่าต้องเพิ่มหรือลด
            const currentCards = container.getElementsByClassName('basket-card');
            
            if (currentCards.length < basketCount) {
                // Add new baskets
                for (let i = currentCards.length; i < basketCount; i++) {
                    const html = template.replace(/{index}/g, i).replace(/{num}/g, i + 1);
                    container.insertAdjacentHTML('beforeend', html);
                }
            } else if (currentCards.length > basketCount) {
                // Remove excess baskets
                while (currentCards.length > basketCount) {
                    container.removeChild(currentCards[currentCards.length - 1]);
                }
            }
            
            calculatePrice();
        }

        function setService(index, type) {
            const card = document.querySelector(`.basket-card[data-index="${index}"]`);
            const btns = card.querySelectorAll('.service-btn');
            const input = card.querySelector('.basket-service');
            const washSec = card.querySelector('.wash-section');
            const drySec = card.querySelector('.dry-section');

            // UI Update
            btns.forEach(btn => {
                btn.className = btn.className.replace('active bg-green-50 border-green-500 text-green-700 bg-blue-50 border-blue-500 text-blue-700 bg-orange-50 border-orange-500 text-orange-700', '');
                btn.classList.add('border-gray-200', 'text-gray-600'); // Reset style
            });
            
            // Set Active Style
            const clickedBtn = type === 'wash_only' ? card.querySelector('.btn-wash') : 
                               type === 'dry_only' ? card.querySelector('.btn-dry') : 
                               card.querySelector('.btn-both');
                               
            clickedBtn.classList.remove('border-gray-200', 'text-gray-600');
            if(type === 'wash_only') clickedBtn.classList.add('active', 'bg-blue-50', 'border-blue-500', 'text-blue-700');
            if(type === 'dry_only') clickedBtn.classList.add('active', 'bg-orange-50', 'border-orange-500', 'text-orange-700');
            if(type === 'wash_dry') clickedBtn.classList.add('active', 'bg-green-50', 'border-green-500', 'text-green-700');

            input.value = type;

            // Show/Hide Sections based on Mode (Self only)
            const mode = card.querySelector('.basket-mode').value;
            if (mode === 'self') {
                if (type === 'wash_only') {
                    washSec.classList.remove('hidden');
                    drySec.classList.add('hidden');
                } else if (type === 'dry_only') {
                    washSec.classList.add('hidden');
                    drySec.classList.remove('hidden');
                } else {
                    washSec.classList.remove('hidden');
                    drySec.classList.remove('hidden');
                }
            }
            calculatePrice();
        }

        function setMode(index, mode) {
            const card = document.querySelector(`.basket-card[data-index="${index}"]`);
            const selfBtn = card.querySelector('.mode-self');
            const maidBtn = card.querySelector('.mode-maid');
            const input = card.querySelector('.basket-mode');
            const sizeOptions = card.querySelector('.size-options');
            const maidMsg = card.querySelector('.maid-message');

            input.value = mode;

            if (mode === 'self') {
                selfBtn.className = "mode-btn mode-self w-1/2 text-xs py-1.5 rounded-md font-bold shadow-sm bg-white text-gray-800 transition";
                maidBtn.className = "mode-btn mode-maid w-1/2 text-xs py-1.5 rounded-md font-bold text-gray-500 transition";
                sizeOptions.classList.remove('hidden');
                maidMsg.classList.add('hidden');
                
                // Re-trigger service visibility check
                const service = card.querySelector('.basket-service').value;
                setService(index, service);
            } else {
                maidBtn.className = "mode-btn mode-maid w-1/2 text-xs py-1.5 rounded-md font-bold shadow-sm bg-white text-orange-600 transition";
                selfBtn.className = "mode-btn mode-self w-1/2 text-xs py-1.5 rounded-md font-bold text-gray-500 transition";
                sizeOptions.classList.add('hidden');
                maidMsg.classList.remove('hidden');
            }
            calculatePrice();
        }

        function previewImage(input) {
            const container = input.parentElement;
            const label = container.querySelector('.photo-label');
            const img = container.querySelector('.preview-img');

            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                    label.classList.add('hidden');
                    container.classList.add('border-solid', 'border-green-400');
                    container.classList.remove('border-dashed');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function togglePaymentInfo() {
            const method = document.querySelector('input[name="paymentMethod"]:checked').value;
            const qrInfo = document.getElementById('qrInfo');
            if (method === 'qr') {
                qrInfo.classList.remove('hidden');
            } else {
                qrInfo.classList.add('hidden');
            }
        }

        function calculatePrice() {
            let total = 0;
            let isMaidSelected = false;

            const cards = document.querySelectorAll('.basket-card');
            cards.forEach(card => {
                const mode = card.querySelector('.basket-mode').value;
                
                if (mode === 'maid') {
                    isMaidSelected = true;
                    // Maid mode adds 0 to calculation initially
                } else {
                    const service = card.querySelector('.basket-service').value;
                    const washSelect = card.querySelector('.basket-wash-size');
                    const drySelect = card.querySelector('.basket-dry-size');
                    const extraDry = card.querySelector('.basket-dry-extra').checked;
                    
                    let washPrice = 0;
                    let dryPrice = 0;

                    if (service !== 'dry_only') {
                        washPrice = parseInt(washSelect.options[washSelect.selectedIndex].getAttribute('data-price'));
                    }
                    if (service !== 'wash_only') {
                        dryPrice = parseInt(drySelect.options[drySelect.selectedIndex].getAttribute('data-price'));
                        if (extraDry) dryPrice += 10;
                    }

                    // Update local labels
                    card.querySelector('.wash-price').textContent = washPrice > 0 ? washPrice + '฿' : '';
                    card.querySelector('.dry-price').textContent = dryPrice > 0 ? dryPrice + '฿' : '';

                    total += washPrice + dryPrice;
                }
            });

            const display = document.getElementById('totalPriceDisplay');
            display.textContent = total;
            
            if (isMaidSelected) {
                display.innerHTML = total + ' <span class="text-xs font-normal text-gray-500">(+รอแม่บ้านสรุป)</span>';
            }
        }

        // --- Submit Logic (Generate Message) ---

        function submitOrder() {
            const phone = document.getElementById('customerPhone').value;
            if (!phone || phone.length < 9) {
                alert('กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง');
                return;
            }

            const cards = document.querySelectorAll('.basket-card');
            let orderDetails = '';
            let total = 0;
            let hasError = false;

            // Generate Summary Text
            cards.forEach((card, index) => {
                const qNum = card.querySelector('.basket-queue').value;
                if (!qNum) { hasError = true; }
                
                const temp = card.querySelector('.basket-temp').options[card.querySelector('.basket-temp').selectedIndex].text;
                const mode = card.querySelector('.basket-mode').value;
                const serviceVal = card.querySelector('.basket-service').value;
                
                let details = '';
                if (mode === 'maid') {
                    details = '👩 แม่บ้านเลือกให้';
                } else {
                    if (serviceVal !== 'dry_only') {
                        const wSize = card.querySelector('.basket-wash-size');
                        const wPrice = parseInt(wSize.options[wSize.selectedIndex].getAttribute('data-price'));
                        details += `ซัก ${wSize.value}(${wPrice}฿) `;
                        total += wPrice;
                    }
                    if (serviceVal !== 'wash_only') {
                        const dSize = card.querySelector('.basket-dry-size');
                        const dPriceBase = parseInt(dSize.options[dSize.selectedIndex].getAttribute('data-price'));
                        const extra = card.querySelector('.basket-dry-extra').checked;
                        const dPrice = extra ? dPriceBase + 10 : dPriceBase;
                        details += `+ อบ ${dSize.value}(${dPrice}฿) `;
                        total += dPrice;
                    }
                }

                orderDetails += `${index + 1}. คิว #${qNum || '?'} ${temp}\n   ${details}\n`;
            });

            if (hasError) {
                alert('กรุณากรอกเลขบัตรคิวให้ครบทุกตะกร้า');
                return;
            }

            const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value === 'qr' ? 'โอนเงิน (QR)' : 'เงินสด';

            // Construct Message to send back to chat
            const message = `🧺 *ออเดอร์ใหม่ (Web Form)*\n` +
                            `-------------------------\n` +
                            `📞 เบอร์: ${phone}\n` +
                            `💳 ชำระ: ${paymentMethod}\n` +
                            `💰 ยอดรวม: ${total} บาท\n` +
                            `-------------------------\n` +
                            `📦 *รายการตะกร้า (${basketCount} ใบ):*\n` +
                            orderDetails + 
                            `\n(ส่งรูปสลิป/ตะกร้า ในแชทถัดไป)`;

            // In Real App: Use liff.sendMessages
            if (window.liff && liff.isInClient()) {
                liff.sendMessages([{
                    type: 'text',
                    text: message
                }]).then(() => {
                    liff.closeWindow();
                }).catch((err) => {
                    alert('Error sending message: ' + err);
                });
            } else {
                // For Browser Testing
                alert("Simulated Message sent to LINE:\n\n" + message);
                console.log(message);
            }
        }
    </script>
</body>
</html>
